[build-system]
requires = ["uv_build>=0.11.3"]
build-backend = "uv_build"

[project]
name = "PDFire"
version = "0.1.0"
description = "A web application to convert image files to PDFs using Flask as the backend and Tailwind CSS as the frontend."
authors = [
    { name = "Madhurjya Dasgupta", email = "lunaticpython2003@users.noreply.github.com" },
    { name = "Pooranjoy Bhattacharya", email = "pooranjoyb2016@gmail.com" },
]
requires-python = ">=3.12.0"
license = "GPL-3.0-or-later"
maintainers = [{ name = "Lari Liuhamo", email = "lari.liuhamo+pypi@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Flask>=3.1.3,<4",
    "Pillow>=12.2.0",
    "gunicorn>=25.3.0,<26",
]

[dependency-groups]
dev = [
    "mypy>=1.0.0,<2",
    "pylint>=4.0.5,<5",
    "ruff>=0.15.9",
]

[tool.uv.build-backend]
module-root = "src"

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
    "COM812",  # Missing trailing comma (disabled due to formatter conflict)
    "D203",    # One blank line before class docstring
    "D212",    # Multi-line summary first line
    "ISC001",  # Single-line implicit string concatenation (disabled due to formatter conflict)
    "PLR0913", # Too many arguments
    "Q000",    # Single quotes found but double quotes preferred
]
line-length = 120
show-fixes = true

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# https://beta.ruff.rs/docs/rules/
"__init__.py" = ["F401", "F403", "F405", "PGH003",]
"tests/*" = ["ANN", "ARG", "INP001", "S101",]

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 20
max-returns = 10
max-statements = 80

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
